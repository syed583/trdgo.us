<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Trdgo.us</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #16171b; --border: #2a2c33; --border-2: #35373f;
    --text: #ededf0; --dim: #9a9ca4; --mute: #696b74;
    --green: #e0a45c; --blue: #cf9147; --red: #f2465a; --gold: #e0a45c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 28px 24px;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .mark {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: #111318; border: 1px solid var(--border-2);
    display: grid; place-items: center;
  }
  .name { font-size: 17px; font-weight: 800; letter-spacing: -.4px; }
  .name span { color: var(--green); }
  .tag {
    font-size: 8px; letter-spacing: 1.3px; color: var(--mute);
    font-weight: 600; margin: 0 0 22px 39px;
  }
  label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
  input {
    width: 100%; padding: 10px 12px;
    background: #101114; color: var(--text);
    border: 1px solid var(--border-2); border-radius: 6px;
    font: inherit; outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    width: 100%; margin-top: 14px; padding: 10px;
    background: #cf9147; color: #16171b; font: inherit; font-weight: 700;
    border: 0; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #e0a45c; }
  button:disabled { opacity: .6; cursor: default; }
  .demo-btn {
    margin-top: 9px; background: transparent; color: var(--dim);
    border: 1px solid var(--border-2); font-weight: 600;
  }
  .demo-btn:hover { background: #1d1e23; color: var(--text); }
  .err {
    display: none; margin-top: 12px; font-size: 12px; color: var(--red);
    background: rgba(242,70,90,.12); border: 1px solid rgba(242,70,90,.35);
    border-radius: 6px; padding: 8px 10px;
  }
  .foot { margin-top: 18px; font-size: 10.5px; color: var(--mute); line-height: 1.6; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <defs><linearGradient id="g" x1="18" y1="18" x2="48" y2="50" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ecc389"/><stop offset=".55" stop-color="#c88a45"/><stop offset="1" stop-color="#a4692c"/>
          </linearGradient></defs>
          <circle cx="32" cy="32" r="24" fill="#111318"/>
          <path d="M 23 11 A 23 23 0 1 0 53 43" fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round"/>
          <g fill="url(#g)">
            <path d="M25 24C19 22 14 17 13 12c-1-2 2-3 3-1 3 5 8 8 12 9 2 1 0 5-3 4z"/>
            <path d="M39 24c6-2 11-7 12-12 1-2-2-3-3-1-3 5-8 8-12 9-2 1 0 5 3 4z"/>
            <path d="M32 27c6 0 11 4 12 10 1 4-1 8-4 11-2 2-5 3-8 3s-6-1-8-3c-3-3-5-7-4-11 1-6 6-10 12-10zm0 6c-3 0-6 2-6 5 0 2 1 4 3 5 1 1 2 1 3 1s2 0 3-1c2-1 3-3 3-5 0-3-3-5-6-5z"/>
          </g>
          <g fill="#111318">
            <ellipse cx="26.5" cy="30" rx="2.1" ry="2.6"/><ellipse cx="37.5" cy="30" rx="2.1" ry="2.6"/>
            <ellipse cx="29.7" cy="41" rx="1.5" ry="2"/><ellipse cx="34.3" cy="41" rx="1.5" ry="2"/>
          </g>
        </svg>
      </div>
      <div class="name">Trdgo<span>.us</span></div>
    </div>
    <div class="tag">TRADE SMARTER. FASTER.</div>

    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username"
           placeholder="admin" autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           required />
    <button id="submit" type="submit">Sign in</button>
    <button id="demo" type="button" class="demo-btn">Try the demo</button>
    <div class="err" id="err"></div>

    <div class="foot">
      Private research tool. Leave the username as <b>admin</b> to sign in as the owner, or use the account you were given.
      The demo opens the app with sample data — no account needed.
    </div>
  </form>

<script>
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  const submit = document.getElementById('submit');

  document.getElementById('demo').addEventListener('click', () => {
    // The shell loads unauthenticated when ?demo=1 is set; it renders from
    // bundled sample data and never calls a protected endpoint.
    window.location.href = '/?demo=1';
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    err.style.display = 'none';
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }),
      });
      if (response.ok) {
        window.location.replace('/');
        return;
      }
      const body = await response.json().catch(() => ({}));
      err.textContent = body.detail || 'Incorrect password';
      err.style.display = 'block';
    } catch (e) {
      err.textContent = 'Could not reach the server.';
      err.style.display = 'block';
    }
    submit.disabled = false;
    submit.textContent = 'Sign in';
  });
</script>
</body>
</html>
