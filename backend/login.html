<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>US-Stock Reader</title>
<style>
  :root {
    --bg: #070b14; --panel: #0d1424; --border: #1b2438; --border-2: #232f49;
    --text: #e6ebf5; --dim: #8892a8; --mute: #5b6580;
    --green: #21d07a; --blue: #3b82f6; --red: #f2465a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 28px 24px;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .mark {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: #0E1626; border: 1px solid var(--border-2);
    display: grid; place-items: center;
  }
  .name { font-size: 17px; font-weight: 800; letter-spacing: -.4px; }
  .name span { color: var(--green); }
  .tag {
    font-size: 8px; letter-spacing: 1.3px; color: var(--mute);
    font-weight: 600; margin: 0 0 22px 39px;
  }
  label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
  input {
    width: 100%; padding: 10px 12px;
    background: #0a0f1c; color: var(--text);
    border: 1px solid var(--border-2); border-radius: 6px;
    font: inherit; outline: none;
  }
  input:focus { border-color: var(--blue); }
  button {
    width: 100%; margin-top: 14px; padding: 10px;
    background: #2563eb; color: #fff; font: inherit; font-weight: 600;
    border: 0; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: .6; cursor: default; }
  .err {
    display: none; margin-top: 12px; font-size: 12px; color: var(--red);
    background: rgba(242,70,90,.12); border: 1px solid rgba(242,70,90,.35);
    border-radius: 6px; padding: 8px 10px;
  }
  .foot { margin-top: 18px; font-size: 10.5px; color: var(--mute); line-height: 1.6; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand">
      <div class="mark">
        <svg width="18" height="18" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="6.5" y="19" width="4" height="7" rx="1.2" fill="#3B82F6" opacity=".85"/>
          <rect x="13" y="14" width="4" height="12" rx="1.2" fill="#3B82F6"/>
          <rect x="19.5" y="9" width="4" height="17" rx="1.2" fill="#21D07A"/>
        </svg>
      </div>
      <div class="name">US-Stock<span> Reader</span></div>
    </div>
    <div class="tag">TRADE SMARTER. FASTER.</div>

    <label for="password">Access password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           autofocus required />
    <button id="submit" type="submit">Sign in</button>
    <div class="err" id="err"></div>

    <div class="foot">
      Private research tool. It reads market data and never places orders.
    </div>
  </form>

<script>
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    err.style.display = 'none';
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      if (response.ok) {
        window.location.replace('/');
        return;
      }
      const body = await response.json().catch(() => ({}));
      err.textContent = body.detail || 'Incorrect password';
      err.style.display = 'block';
    } catch (e) {
      err.textContent = 'Could not reach the server.';
      err.style.display = 'block';
    }
    submit.disabled = false;
    submit.textContent = 'Sign in';
  });
</script>
</body>
</html>
