# nginx in front of US-Stock Reader.
#
# Replace stocks.example.com with your domain, then let certbot rewrite this
# file for HTTPS:  sudo certbot --nginx -d stocks.example.com

server {
    listen 80;
    server_name stocks.example.com;

    # The analysis screen streams its progress as server-sent events. A
    # buffering proxy holds every event until the run finishes, so the page
    # sits at "5 of 12" and then jumps to done -- which reads as a hang.
    location /api/analyze/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A first analysis of a cold symbol can take a while; the default
        # 60s would cut it off mid-answer.
        proxy_read_timeout 300s;
    }

    client_max_body_size 4m;
    gzip on;
    gzip_types application/json application/javascript text/css;
}
