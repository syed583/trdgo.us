<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trdgo.us — Figma demo (dev only)</title>
    <!-- Tailwind from the CDN, for the DEMO ONLY. The app itself has no Tailwind build, and this
         folder is never part of the app bundle, so nothing here can reach the server. -->
    <!-- The frame uses Inter and Roboto. Without them the browser substitutes a system face and every
         text block shifts - which a pixel diff showed as the single largest difference. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>
      html, body { margin: 0; background: #0a1022; font-family: 'Roboto', 'Inter', system-ui, sans-serif; }
      /* The frames are drawn at a fixed canvas size; the demo shows them at that size. */
      .frame-wrap { width: max-content; margin: 0 auto; }
      .demo-nav { display:flex; flex-wrap:wrap; gap:6px; align-items:center;
        padding:8px 12px; background:#060b18; border-bottom:1px solid #1d2a4d;
        font:500 12px/1.2 'Roboto',system-ui,sans-serif; color:#8ea0c4; position:sticky; top:0; z-index:99; }
      .demo-nav b { color:#dbe6ff; margin-right:10px; font-weight:700; }
      .demo-nav a { color:#8ea0c4; text-decoration:none; padding:5px 10px; border-radius:7px;
        border:1px solid #1d2a4d; white-space:nowrap; }
      .demo-nav a:hover { color:#fff; border-color:#2f4d8f; }
      .demo-nav a.on { background:#1c61f5; color:#fff; border-color:#4876ff; }
      .demo-size { margin-left:auto; color:#5f7099; }
      /* Figma emits font-['Inter:Bold'] and font-['Roboto:Medium']. Those are not real font families,
         so the browser drops the declaration and the text silently falls back. The WEIGHT survives
         (font-bold / font-medium are separate classes), so only the family needs mapping. */
      [class*="font-['Inter"] { font-family: 'Inter', sans-serif !important; }
      [class*="font-['Roboto"] { font-family: 'Roboto', sans-serif !important; }
      /* Condensed must come AFTER the plain Roboto rule: the table frames use it heavily, and
         substituting normal-width Roboto widened every condensed column. */
      [class*="font-['Roboto:Condensed"] { font-family: 'Roboto Condensed', sans-serif !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
