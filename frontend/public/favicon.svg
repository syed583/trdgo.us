  <rect width="32" height="32" rx="7" fill="#0E1626"/>
  <rect x="4" y="18" width="4.6" height="10" rx="1.5" fill="#64748B"/>
  <rect x="11" y="13" width="4.6" height="15" rx="1.5" fill="#3B82F6"/>
  <rect x="18" y="16" width="4.6" height="12" rx="1.5" fill="#64748B"/>
  <rect x="25" y="5" width="4.6" height="23" rx="1.5" fill="#21D07A"/>
</svg>
