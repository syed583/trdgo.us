<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="US-Stock Reader — personal US market intelligence: live IBKR data, earnings scoring and options analytics." />
    <meta name="theme-color" content="#070b14" />
    <title>US-Stock Reader — Market Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1626'/%3E%3Crect x='6.5' y='19' width='4' height='7' rx='1.2' fill='%233B82F6' opacity='.85'/%3E%3Crect x='13' y='14' width='4' height='12' rx='1.2' fill='%233B82F6'/%3E%3Crect x='19.5' y='9' width='4' height='17' rx='1.2' fill='%2321D07A'/%3E%3Cpath d='M8 13.5L14.5 9.5L18.5 11.5L25 5.5' stroke='%2321D07A' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='5.5' r='2.3' fill='%2321D07A'/%3E%3C/svg%3E" />
    <script>
      // Applied before the stylesheet paints, so a light-theme user does not
      // get a dark flash on every page load.
      (function () {
        try {
          var stored = window.localStorage.getItem('usr.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
