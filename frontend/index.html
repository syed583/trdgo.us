<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tradgo.US — personal US market intelligence: live IBKR data, earnings scoring and options analytics." />
    <meta name="theme-color" content="#070b14" />
    <title>Tradgo.US — Market Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1626'/%3E%3Crect x='4' y='18' width='4.6' height='10' rx='1.5' fill='%2364748B'/%3E%3Crect x='11' y='13' width='4.6' height='15' rx='1.5' fill='%233B82F6'/%3E%3Crect x='18' y='16' width='4.6' height='12' rx='1.5' fill='%2364748B'/%3E%3Crect x='25' y='5' width='4.6' height='23' rx='1.5' fill='%2321D07A'/%3E%3C/svg%3E" />
    <script>
      // Applied before the stylesheet paints, so a light-theme user does not
      // get a dark flash on every page load.
      (function () {
        try {
          var stored = window.localStorage.getItem('usr.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
